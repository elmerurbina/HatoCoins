<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Certificado de Price Discovery HatoMaster">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfaf1"/>
      <stop offset="55%" stop-color="#f6f0df"/>
      <stop offset="100%" stop-color="#ece3cd"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eabf4e"/>
      <stop offset="45%" stop-color="#a8801d"/>
      <stop offset="70%" stop-color="#f0d383"/>
      <stop offset="100%" stop-color="#8a6514"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f9e5f"/>
      <stop offset="100%" stop-color="#1d5c34"/>
    </linearGradient>
    <pattern id="guilloche" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 7h14M7 0v14" stroke="#1d5c34" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="480" height="360" fill="url(#paper)"/>
  <rect width="480" height="360" fill="url(#guilloche)"/>

  <rect x="14" y="14" width="452" height="332" fill="none" stroke="url(#foil)" stroke-width="3"/>
  <rect x="24" y="24" width="432" height="312" fill="none" stroke="#1d5c34" stroke-opacity="0.35" stroke-width="1"/>
  <rect x="30" y="30" width="420" height="300" fill="none" stroke="#1d5c34" stroke-opacity="0.18" stroke-width="1"/>

  <g fill="none" stroke="#1d5c34" stroke-opacity="0.3" stroke-width="1.4">
    <path d="M24 60h18M24 60v18M456 60h-18M456 60v18M24 300h18M24 300v-18M456 300h-18M456 300v-18"/>
  </g>

  <text x="240" y="88" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" letter-spacing="5" fill="#8a6514">HATOMASTER</text>

  <text x="240" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" fill="#123a24">CERTIFICADO</text>

  <g stroke="url(#foil)" stroke-width="2">
    <line x1="150" y1="154" x2="330" y2="154"/>
  </g>

  <text x="240" y="182" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="2.5" fill="#5a6b5f">DE PRICE DISCOVERY</text>

  <text x="240" y="222" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#3a4a40">Se otorga el presente reconocimiento a</text>
  <text x="240" y="252" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" fill="#123a24">Quien Ordeñó a Brissa</text>

  <g transform="translate(96 300)">
    <line x1="0" y1="0" x2="88" y2="0" stroke="#1d5c34" stroke-opacity="0.55" stroke-width="1"/>
    <text x="44" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="9" letter-spacing="1.5" fill="#5a6b5f">FIRMA</text>
  </g>

  <g transform="translate(384 300)">
    <line x1="-88" y1="0" x2="0" y2="0" stroke="#1d5c34" stroke-opacity="0.55" stroke-width="1"/>
    <text x="-44" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="9" letter-spacing="1.5" fill="#5a6b5f">SELLO</text>
  </g>

  <g transform="translate(240 288)">
    <circle r="30" fill="url(#seal)" stroke="url(#foil)" stroke-width="2.5"/>
    <circle r="23" fill="none" stroke="#fdfaf1" stroke-opacity="0.65" stroke-width="1"/>
    <text y="-3" text-anchor="middle" font-family="Georgia, serif" font-size="8.5" letter-spacing="1.6" fill="#fdfaf1">HATO</text>
    <text y="9" text-anchor="middle" font-family="Georgia, serif" font-size="8.5" letter-spacing="1.6" fill="#fdfaf1">COINS</text>
  </g>
</svg>
